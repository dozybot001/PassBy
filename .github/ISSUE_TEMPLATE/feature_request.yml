name: 建议 / Suggestion
description: 改进建议。新功能目前不接受。An idea. New features are not accepted at the moment.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        PassBy 目前只接受安全修复、崩溃或丢数据的修复、文字和翻译更正，见 CONTRIBUTING.md。
        PassBy currently accepts only security fixes, fixes for crashes or data loss, and text and translation corrections; see CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题 / The problem
      description: 你想做什么、现在为什么做不到。What you want to do and why you can't now.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 建议的做法 / What you suggest
