# Extends gitleaks' default rules for this repository.
[extend]
useDefault = true

[allowlist]
description = "Intentional test data"
# Keys in the export-format and sync test vectors are fixed test values
# (docs/export-format.md §6, docs/sync.md §5).
paths = ['''^docs/export-vectors\.json$''', '''^docs/sync-vectors\.json$''']
