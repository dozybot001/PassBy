<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none';">
  <title>Connecting to Tenon · PassBy</title>
  <link rel="icon" href="../../web/tenon-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../web/style.css">
  <script type="module" src="../../web/redirect.mjs"></script>
</head>
<body>
  <main class="login-transition" aria-live="polite">
    <img src="../../web/tenon-mark.svg" width="56" height="56" alt="Tenon">
    <h1 id="transition-title">Connecting to Tenon…</h1>
    <p id="transition-status" class="transition-progress"><span class="is-loading" aria-hidden="true"></span><span id="transition-message">Preparing secure sign-in…</span></p>
    <div class="tenon-actions" id="transition-actions" hidden>
      <button class="pill primary" id="transition-retry">Try again</button>
      <a class="pill" href="../../" id="transition-back">Return to PassBy</a>
    </div>
    <noscript>JavaScript is required to sign in. <a href="../../">Return to PassBy</a></noscript>
  </main>
</body>
</html>
