[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
biometric = "1.1.0"
fragment = "1.9.1"
junit = "4.13.2"
zxing = "3.5.4"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
# androidx.biometric 1.1.0 asks for fragment 1.2.5, whose FragmentActivity rejects the request codes the
# file pickers use. The app needs a current one.
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Tests only: decodes the QR code the app draws. It is not part of the app.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
